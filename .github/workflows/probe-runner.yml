name: probe-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: List Xcodes and platforms
        run: |
          set +e
          echo "=== Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null
          for xc in /Applications/Xcode*.app; do
            echo "--- $xc ---"
            "$xc/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -2
            echo "platforms dir:"
            ls "$xc/Contents/Developer/Platforms" 2>/dev/null | tr '\n' ' '
            echo
            echo "sdks:"
            "$xc/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null | grep -Ei 'ios|simulator' | head -8
            echo
          done
          echo "=== current select ==="
          xcode-select -p
          xcodebuild -version
          echo "=== runtimes ==="
          xcrun simctl list runtimes 2>&1 | head -10
          echo "=== platform download state ==="
          /usr/bin/xcodebuild -showComponent iOS 2>&1 | head -20
      - name: Upload probe output
        run: |
          {
            echo "=== probe ==="
            xcode-select -p
            ls -d /Applications/Xcode*.app
          } > probe.txt
