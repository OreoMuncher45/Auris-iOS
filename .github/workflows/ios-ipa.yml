name: iOS IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to stamp into the IPA (x.y.z)'
        required: true
        default: '1.0.4'
      publish:
        description: 'Create a GitHub release with the IPA attached'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'AppleApp/**'
      - 'shared/**'
      - 'native-core/**'
      - 'vendor/innertubex/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    # Xcode 26 is required: the app uses .glassEffect (iOS 26), the Icon
    # Composer AppIcon.icon bundle, and the MusicUnderstanding framework.
    runs-on: macos-26
    timeout-minutes: 120

    env:
      CONFIG: release
      IOS_SIMULATOR: 'false'
      NATIVE_TARGETS: 'aarch64-apple-darwin aarch64-apple-ios'
      MARKETING_VERSION: ${{ inputs.version || '1.0.4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || \
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | head -1)"
          xcodebuild -version
          swift --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: |
          brew install xcodegen cmake
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native-core/Cargo.toml', 'native-core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build shared framework (Kotlin/Native)
        run: scripts/build-shared-framework.sh
        env:
          CONFIG: release
          IOS_SIMULATOR: 'false'

      - name: Build native core (Rust/UniFFI)
        run: scripts/build-native-core.sh
        env:
          NATIVE_TARGETS: 'aarch64-apple-darwin aarch64-apple-ios'

      - name: Stamp version
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path('AppleApp/project.yml')
          t = p.read_text()
          version = os.environ['MARKETING_VERSION']
          t = re.sub(r'MARKETING_VERSION: "[^"]+"', f'MARKETING_VERSION: "{version}"', t)
          p.write_text(t)
          print('MARKETING_VERSION =', version)
          PY
          grep MARKETING_VERSION AppleApp/project.yml

      - name: Generate Xcode project
        working-directory: AppleApp
        run: xcodegen generate

      - name: Package unsigned IPA
        run: scripts/package-ios-ipa.sh "$MARKETING_VERSION" --output-dir build/release --overwrite

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: auris-ios-unsigned-ipa
          path: build/release/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ (inputs.publish == true) || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.ipa
          generate_release_notes: true
