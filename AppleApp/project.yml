# xcodegen spec — app target + WidgetKit extension target, shared App Group
# entitlement (spec §0, §9). Generate with: xcodegen generate
# iPhone-only release: the deployment floor is iOS 18 (bitchord-apple-ui-spec.md §9),
# which unlocks Tab, TabSection, .tabViewStyle(.sidebarAdaptable),
# Tab(role: .search) and MeshGradient. iOS 26-only chrome
# (.tabViewBottomAccessory, Liquid Glass) is availability-gated at call sites.
name: Auris
attributes:
  LastUpgradeCheck: "1520"
options:
  createIntermediateGroups: true
  developmentLanguage: en
  # The locales the String Catalog ships. XcodeGen writes these into the
  # project's knownRegions so the localized .lproj folders are packaged.
  knownRegions: [en, de, es, fr, he, hi, id, it, ja, pl, pt-BR, ru, th, tr, vi, zh-Hans, zh-Hant, zh-HK]
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "13"
    AURIS_BUILD_REVISION: "unknown"
    # Typed asset symbols (Image(.bchHome)) — Xcode 15+ asset codegen.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    # String Catalog localization (upstream ships 19 locales; translations
    # carried over from its strings.xml where the English matches exactly).
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Each developer selects their own Team in Xcode's Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    # The spec (§0) ports arm64 targets only: iosArm64, iosSimulatorArm64.
    # Generic iOS Simulator destinations otherwise attempt a
    # universal arm64+x86_64 build, which cannot link against the arm64-only
    # AurisShared / AurisCoreFFI slices.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # iPhone-only release: iPad is not a supported destination.
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Auris:
    type: application
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.auris.Auris
        # Music Understanding is resolved on OS 27+; below that Automix runs on
        # the Rust MIR. The framework is not part of the iOS 26 SDK, so it is
        # not linked here — the analyzer guards itself with canImport.
    sources:
      - path: Sources
        excludes:
          - "Widget/**"
      - path: Assets.xcassets
      # Icon Composer app icon (Liquid Glass, with dark/tinted/clear modes on
      # OS 26+). Same name as the asset-catalog AppIcon, which older systems use.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
      # UniFFI-generated AurisCore.swift lands here via scripts/build-native-core.sh.
      - path: Generated
        optional: true
      - path: Resources/Models
        optional: true
        type: folder
        buildPhase: resources
      - path: Resources/Localization
        buildPhase: resources
      - path: Resources/AudioLicenses
        type: folder
        buildPhase: resources
      - path: Resources/YouTubeSolver
        type: folder
        buildPhase: resources
    dependencies:
      - target: AurisWidget
        embed: true
      - framework: Frameworks/AurisShared.xcframework
        embed: true
      - framework: Frameworks/AurisCoreFFI.xcframework
        embed: true
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: Speech.framework
    info:
      path: Auris-Info.plist
      properties:
        CFBundleDisplayName: Auris
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AurisRevision: "$(AURIS_BUILD_REVISION)"
        LSApplicationCategoryType: public.app-category.music
        CFBundleURLTypes:
          - CFBundleURLName: app.auris.Auris
            CFBundleURLSchemes: [auris]
        # Handoff of playback: the activity type the payload is carried in. The
        # system only launches this app for an activity it has been told about,
        # so the type is declared here as well as written in
        # `PlaybackHandoffPayload.activityType`.
        NSUserActivityTypes:
          - app.auris.playback
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        NSMotionUsageDescription: Auris uses headphone motion to keep its spatial effect anchored when you turn your head.
        NSPhotoLibraryAddUsageDescription: Auris saves the lyric share cards you choose to add to Photos.
        NSSpeechRecognitionUsageDescription: Auris uses on-device speech recognition to align fetched lyrics with the playing audio. Audio is not sent to a server for alignment.
    entitlements:
      path: Auris.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.app.auris.Auris
        # iCloud key-value store: syncs the per-song lyrics provider choice (O1).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
  AurisWidget:
    type: app-extension
    supportedDestinations: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.auris.Auris.widget
    sources:
      - Sources/Widget
    info:
      path: AurisWidget-Info.plist
      properties:
        CFBundleDisplayName: Auris Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AurisRevision: "$(AURIS_BUILD_REVISION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AurisWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.auris.Auris
